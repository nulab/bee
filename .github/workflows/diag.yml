name: diag
on:
  push:
    branches: [claude/toolchain-pnpm-11-devengines]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4
      - name: env
        run: |
          node -e "console.log('report:',JSON.stringify(process.report.getReport().header.glibcVersionRuntime))"
          ldd --version | head -2
          getconf GNU_LIBC_VERSION || true
      - name: install with 11.24.0
        run: |
          corepack pnpm@11.24.0 install --frozen-lockfile
          echo "=== the four packages that pnpm 11.23.0 skipped ==="
          for p in oxlint oxfmt rolldown astrojs; do
            printf "%-10s " "$p"
            ls node_modules/.pnpm | grep -i "$p.*linux-x64-gnu" || echo MISSING
          done
          echo "=== can the tools actually run? ==="
          node node_modules/vitest/vitest.mjs --version || echo "vitest FAILED"
          pnpm exec oxlint --version || echo "oxlint FAILED"
