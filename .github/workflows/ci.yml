name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    name: Test (Node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5.6.4.2.5
        with:
          install_args: node@${{ matrix.node-version }}

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm exec vitest run --coverage.enabled

      - name: Report coverage
        if: always() && github.event_name == 'pull_request' && matrix.node-version == 24
        uses: davelosert/vitest-coverage-report-action@3c50566c523e04813df28de8f7c48dd97d663f1c # v2

  build:
    runs-on: ubuntu-latest

    name: Build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5.6.4.2.5

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `unbuild` exits 0 for a bundle that cannot actually run, so the built
      # artifact is executed here rather than only being produced. A top-level
      # await deadlock between the entry and its lazily imported command chunks
      # shipped undetected precisely because nothing ran the output.
      - name: Smoke test the built CLI
        run: |
          version=$(node apps/cli/bin/cli.mjs --version)
          echo "bee --version -> ${version}"
          test -n "$version"
          node apps/cli/bin/cli.mjs --help > /dev/null
          node apps/cli/bin/cli.mjs issue --help > /dev/null

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5.6.4.2.5

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm exec oxlint --ignore-pattern 'apps/docs' --max-warnings 0

      - name: Format check
        run: pnpm run format:check

      - name: Check generated Skill is up to date
        run: pnpm --filter @nulab/bee generate:skill:check
