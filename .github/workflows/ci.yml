name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    name: Test (Node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # pnpm 11 requires Node >=22.13 and crashes on Node 20 with
      # "No such built-in module: node:sqlite", so it cannot run on every
      # version in the matrix. mise installs the toolchain Node from mise.toml
      # (used to run pnpm) alongside the version under test.
      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0.6.4.0.0
        with:
          install_args: node@${{ matrix.node-version }}

      # Runs on the mise.toml Node, not the matrix one, so pnpm always has a
      # version it supports.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `mise exec node@<version>` is required to select the matrix Node:
      # mise.toml pins node = "24", so a bare `node` would resolve to 24 and
      # every matrix leg would silently test the same version. Vitest is
      # invoked directly rather than through `pnpm exec`, which would put pnpm
      # back onto the Node under test and crash it on Node 20.
      - name: Test
        run: >-
          mise exec node@${{ matrix.node-version }} --
          node node_modules/vitest/vitest.mjs run --coverage.enabled

      - name: Report coverage
        if: always() && github.event_name == 'pull_request' && matrix.node-version == 24
        uses: davelosert/vitest-coverage-report-action@3c50566c523e04813df28de8f7c48dd97d663f1c # v2

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0.6.4.0.0

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm exec oxlint --ignore-pattern 'apps/docs' --max-warnings 0

      - name: Format check
        run: pnpm run format:check
