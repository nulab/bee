packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

catalog:
  "@astrojs/starlight": ^0.41.7
  "@tsconfig/node-lts": ^24.0.1
  "@tsconfig/node-ts": ^23.6.4
  "@types/node": ^25.9.5
  "@vitest/coverage-v8": 5.0.1
  astro: ^7.2.4
  backlog-js: ^0.19.1
  # Held one major back: commander >=15 needs Node >=22.12 and undici >=8 needs
  # >=22.19, but @nulab/bee publishes `engines.node: ">=20.18"`. Raising either
  # would break installs for Node 20 users, so this is a release decision, not
  # a mechanical bump. Node 20 reached EOL on 2026-04-30; both can go up in the
  # same change that drops Node 20 from engines and the CI matrix.
  commander: ^14.0.3
  consola: ^3.4.2
  is-unicode-supported: ^2.1.0
  jiti: ^2.7.0
  marked: ^18.0.10
  open: ^11.0.1
  rc9: ^3.0.1
  remark-definition-list: ^2.0.0
  sharp: ^0.35.3
  starlight-links-validator: ^0.25.3
  string-width: ^8.2.2
  tsx: ^4.23.12
  # Held at 7 for the same Node 20 reason as commander above.
  undici: ^7.29.0
  valibot: ^1.4.2
  # Vite+ ships Vite as its own core package; the `vite@*` override points every
  # consumer (including Astro) at it so the workspace runs a single Vite.
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  vitest: 5.0.1
