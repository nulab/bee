packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  turbo: true

overrides:
  postcss: ^8.5.26
  nanoid@^3: ^3.3.18
  js-yaml@^4: ^4.3.1
  svgo: ^4.0.2
  vite: ^8.2.2
  esbuild@^0.27: ^0.28.2
  qs: ^6.15.3
  defu: ^6.1.7
  picomatch@^2: ^2.3.2
  picomatch@^4: ^4.0.5
  smol-toml: ^1.6.1
  # rollup-plugin-dts (via unbuild) uses the JS compiler API that typescript 7
  # removed; pin its typescript to 6.x so `unbuild` can still emit .d.ts files.
  rollup-plugin-dts>typescript: ^6.0.3

catalog:
  "@astrojs/starlight": ^0.41.7
  "@tsconfig/node-lts": ^24.0.1
  "@tsconfig/node-ts": ^23.6.4
  "@types/node": ^25.9.5
  "@vitest/coverage-v8": ^4.1.11
  astro: ^7.2.4
  backlog-js: ^0.19.1
  # commander >=15 and undici >=8 require Node >=22.12; the CLI still supports
  # Node >=20.18 (engines / CI matrix), so both stay on their previous majors.
  commander: ^14.0.3
  consola: ^3.4.2
  is-unicode-supported: ^2.1.0
  jiti: ^2.7.0
  lefthook: ^2.1.10
  marked: ^18.0.10
  open: ^11.0.1
  oxfmt: ^0.64.0
  oxlint: ^1.79.0
  oxlint-tsgolint: ^7.0.2001
  rc9: ^3.0.1
  remark-definition-list: ^2.0.0
  sharp: ^0.35.3
  starlight-links-validator: ^0.25.3
  string-width: ^8.2.2
  tsx: ^4.23.12
  turbo: ^2.10.11
  # typescript 7 (tsgo) drops the JS compiler API that rollup-plugin-dts
  # (via unbuild) relies on: `ts.sys` is undefined and dts bundling crashes.
  typescript: ^6.0.3
  unbuild: ^3.6.1
  undici: ^7.29.0
  valibot: ^1.4.2
  vitest: ^4.1.11
